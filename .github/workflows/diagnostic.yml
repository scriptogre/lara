name: diagnostic

on:
  push:
    branches: [diagnostic/cache-report]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install ldid
      - run: ./scripts/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lara-diagnostic
          path: build/lara.ipa
